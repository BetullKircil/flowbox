services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flowbox_user
      POSTGRES_PASSWORD: flowbox_password
      POSTGRES_DB: flowbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowbox_user -d flowbox_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: ./FlowBox.Api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development

volumes:
  postgres_data:
